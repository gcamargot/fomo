[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:token_scanner_daemon]
command=python3 -u token_scanner_daemon.py --daemon --interval %(ENV_SCANNER_INTERVAL)s --chains %(ENV_SCANNER_CHAINS)s
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=TERM
stopasgroup=true
killasgroup=true

[program:dormant_monitor_daemon]
command=python3 -u dormant_monitor_daemon.py --daemon --interval %(ENV_DORMANT_INTERVAL)s
directory=/app
autostart=true
