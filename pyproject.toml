[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fomo"
version = "1.0.0"
description = "FOMO Smart Contract Extractor & Security Analysis Suite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "rich>=13.7.0",
    "tqdm>=4.66.0",
    "web3>=7.0.0",
    "slither-analyzer>=0.10.0",
    "solc-select>=1.0.0",
    "crytic-compile>=0.3.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
