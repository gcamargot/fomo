name: CD

on:
  push:
    branches:
      - main

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-homelab:
    name: Deploy to Homelab (Self-Hosted Runner)
    needs: build-and-push
    runs-on: self-hosted
    steps:
      # Do not use actions/checkout here. The compose volume ./contracts is
      # written as root by the container; checkout then tries to rmRF the
      # workspace (even with clean: false when .git is missing) and dies on
      # EACCES — or, after a chown, would delete the live SQLite corpus.
      - name: Sync repo without wiping contracts volume
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          if [ ! -d .git ]; then
            git init
          fi
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          else
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          fi
          git -c http.extraheader="AUTHORIZATION: bearer ${GH_TOKEN}" \
            fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
          git clean -ffdx -e contracts -e .env
          git log -1 --oneline

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Pull Latest Docker Image
        run: docker compose pull

      - name: Deploy Services with Docker Compose
        run: docker compose up -d --remove-orphans

      - name: Verify Container Health
        run: |
          docker compose ps
          docker inspect fomo-security-suite --format 'image={{.Image}} status={{.State.Status}}'
          echo "FOMO deployed to homelab"
